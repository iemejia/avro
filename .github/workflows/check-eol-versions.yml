name: 'Check EOL Versions'
on:
  workflow_dispatch:
  schedule:
    # Run on the first day of every month at 09:00 UTC
    - cron: '0 9 1 * *'

jobs:
  check-eol:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ruby - source: .github/workflows/test-lang-ruby.yml
          - product: ruby
            version: '2.7'
            workflow: test-lang-ruby.yml
          - product: ruby
            version: '3.0'
            workflow: test-lang-ruby.yml
          - product: ruby
            version: '3.1'
            workflow: test-lang-ruby.yml
          - product: ruby
            version: '3.2'
            workflow: test-lang-ruby.yml
          - product: ruby
            version: '3.3'
            workflow: test-lang-ruby.yml
          # Python - source: .github/workflows/test-lang-py.yml
          - product: python
            version: '3.10'
            workflow: test-lang-py.yml
          - product: python
            version: '3.11'
            workflow: test-lang-py.yml
          - product: python
            version: '3.12'
            workflow: test-lang-py.yml
          - product: python
            version: '3.13'
            workflow: test-lang-py.yml
          - product: python
            version: '3.14'
            workflow: test-lang-py.yml
          # Node.js - source: .github/workflows/test-lang-js.yml
          - product: nodejs
            version: '20'
            workflow: test-lang-js.yml
          - product: nodejs
            version: '22'
            workflow: test-lang-js.yml
          - product: nodejs
            version: '24'
            workflow: test-lang-js.yml
          # PHP - source: .github/workflows/test-lang-php.yml
          - product: php
            version: '8.1'
            workflow: test-lang-php.yml
          - product: php
            version: '8.2'
            workflow: test-lang-php.yml
          - product: php
            version: '8.3'
            workflow: test-lang-php.yml
          - product: php
            version: '8.4'
            workflow: test-lang-php.yml
          - product: php
            version: '8.5'
            workflow: test-lang-php.yml
          # .NET - source: .github/workflows/test-lang-csharp.yml
          - product: dotnet
            version: '6.0'
            workflow: test-lang-csharp.yml
          - product: dotnet
            version: '7.0'
            workflow: test-lang-csharp.yml
          - product: dotnet
            version: '8.0'
            workflow: test-lang-csharp.yml
          # Java (Temurin) - source: .github/workflows/test-lang-java.yml
          - product: eclipse-temurin
            version: '11'
            workflow: test-lang-java.yml
          - product: eclipse-temurin
            version: '17'
            workflow: test-lang-java.yml
          - product: eclipse-temurin
            version: '21'
            workflow: test-lang-java.yml
    steps:
      - uses: actions/checkout@v6

      - name: "Check EOL: ${{ matrix.product }} ${{ matrix.version }}"
        id: eol
        uses: sindrel/endoflife-github-action@v1
        with:
          product: ${{ matrix.product }}
          version: ${{ matrix.version }}
          fail_on_eol: 'true'
          fail_days_left: '90'

      - name: Report Status
        if: always()
        run: |
          echo "### ${{ matrix.product }} ${{ matrix.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.eol.outputs.text_summary }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **EOL:** ${{ steps.eol.outputs.end_of_life }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Days until EOL:** ${{ steps.eol.outputs.days_until_eol }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** \`${{ matrix.workflow }}\`" >> $GITHUB_STEP_SUMMARY

  open-issue:
    runs-on: ubuntu-latest
    needs: check-eol
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create or Update Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Remove end-of-life language versions from CI matrix';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'maintenance',
            });
            const existing = issues.find(i => i.title === title);
            const body = [
              '## End-of-Life Version Alert',
              '',
              `**Generated:** ${new Date().toISOString().split('T')[0]}`,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'One or more language versions in the CI matrix have reached end-of-life',
              'or will reach EOL within 90 days.',
              '',
              'Please review the [workflow run summary](' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})` +
                ' for details on which versions are affected.',
              '',
              '### Recommended Actions',
              '',
              '1. Remove EOL versions from the CI test matrices',
              '2. Update any documentation referencing minimum supported versions',
              '3. Consider adding newly released LTS versions if not already present',
              '',
              '---',
              '*This issue was automatically created by the EOL version check workflow.*',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
              console.log(`Updated existing issue #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['maintenance'],
              });
              console.log(`Created issue #${issue.number}`);
            }
