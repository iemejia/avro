# Development override: mount source code as volumes so you can
# edit files locally and re-run builds without rebuilding images.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml run java ./build.sh test

services:
  java:
    volumes:
      - .:/avro
      - maven-cache:/root/.m2/repository
    working_dir: /avro/lang/java

  python:
    volumes:
      - .:/avro
    working_dir: /avro/lang/py

  js:
    volumes:
      - .:/avro
    working_dir: /avro/lang/js

  c:
    volumes:
      - .:/avro
    working_dir: /avro/lang/c

  cpp:
    volumes:
      - .:/avro
    working_dir: /avro/lang/c++

  csharp:
    volumes:
      - .:/avro
    working_dir: /avro/lang/csharp

  ruby:
    volumes:
      - .:/avro
    working_dir: /avro/lang/ruby

  perl:
    volumes:
      - .:/avro
    working_dir: /avro/lang/perl

  php:
    volumes:
      - .:/avro
    working_dir: /avro/lang/php
